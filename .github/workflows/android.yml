name: Android debug APK

on:
  push:
    branches: [main]
    paths-ignore: ['.loop/**', 'docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/jackygame-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: jackygame-debug-apk
          path: out/jackygame-debug.apk
          retention-days: 14

      - name: Publish to "latest" prerelease
        run: |
          NOTES="Automated debug build of ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ)). Install jackygame-debug.apk on Android (allow unknown sources)."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" --notes "$NOTES"
          fi
          gh release upload latest out/jackygame-debug.apk --clobber
          gh release edit latest --target "$GITHUB_SHA" --prerelease --notes "$NOTES"
          # `--target` alone does NOT move an existing tag; update the ref via the API
          # (affects only the `latest` tag, no git force-push).
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
