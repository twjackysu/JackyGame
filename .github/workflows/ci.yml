name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['.loop/**', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['.loop/**', 'docs/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # V6（D-306）：線上版客戶端建置，而且不能打包 src/server（26-security）
      - name: Online client build (no src/server)
        run: |
          npm run build:online
          node scripts/check-online-bundle.mjs dist-online dist
      # V6（D-305）：線上 API 打包成一個檔案、真的啟動、打 /health；打包結果不能有遊戲畫面（Phaser）
      - name: Server bundle smoke test
        run: |
          npm run build:server
          if grep -q 'Phaser' dist-server/*.js; then echo 'dist-server 裡有 Phaser'; exit 1; fi
          (cd dist-server && AUTH_MODE=dev PORT=8088 node main.js &)
          for i in $(seq 1 20); do curl -sf http://localhost:8088/health && break; sleep 0.5; done
          curl -sf http://localhost:8088/health
      # V6（D-305）：Bicep 能編譯（只編譯，不部署）
      - name: Bicep build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Smoke test (headless Chromium, fail on runtime errors)
        run: |
          # 第 175 輪：apt 偶爾解析不到 security.ubuntu.com（基礎設施），重試三次；
          # 還是不行就只裝瀏覽器本體（runner 映像通常已有相依套件），真的起不來下面的截圖會失敗。
          ok=0
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "playwright install --with-deps 失敗（第 $i 次），20 秒後重試"; sleep 20
          done
          if [ "$ok" != 1 ]; then echo "::warning::apt 裝相依套件失敗，改成只裝 chromium"; npx playwright install chromium; fi
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          SMOKE_STRICT=1 node scripts/screenshot.mjs 'http://localhost:4173/?skipIntro' screenshots/title.png 4000
          SMOKE_STRICT=1 node scripts/screenshot.mjs 'http://localhost:4173/?scene=RtBattle&stage=mistwood' screenshots/mistwood.png 6000
          SMOKE_STRICT=1 node scripts/screenshot.mjs 'http://localhost:4173/?scene=RtBattle&stage=wolf_king&bot=expert' screenshots/wolfking.png 5000
          SMOKE_STRICT=1 node scripts/screenshot.mjs 'http://localhost:4173/?scene=Pvp' screenshots/pvp.png 8000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # D-284：SQL Server 版 Repository 的契約測試（25 §4）。CI 拋棄式容器，密碼只是測試用、不是機密。
  mssql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'CiOnly_Passw0rd!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiOnly_Passw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Create test database
        run: docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiOnly_Passw0rd!' -Q "CREATE DATABASE JackyGameTest"
      - name: Contract tests (Memory／Local／SQL Server)
        # 所有契約測試共用同一個資料庫（fresh 會清表）→ 檔案不能平行跑；SQL 比記憶體慢，逾時放寬
        run: npx vitest run tests/server-contract --no-file-parallelism --test-timeout=60000
        env:
          GAME_DB_TEST_CONNECTION: 'Server=localhost,1433;Database=JackyGameTest;User Id=sa;Password=CiOnly_Passw0rd!;Encrypt=False;TrustServerCertificate=True'
