name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['.loop/**', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['.loop/**', 'docs/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test (headless Chromium, fail on runtime errors)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          SMOKE_STRICT=1 node scripts/screenshot.mjs 'http://localhost:4173/?skipIntro' screenshots/title.png 4000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
