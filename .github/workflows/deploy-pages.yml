name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['.loop/**', 'docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      # 線上版客戶端（第 148 輪）：Jacky 部署好 API、在 repo 的 Actions variables 設 ONLINE_API_URL 才建，放在 /JackyGame/online/。
      # 沒設就跳過（Pages 只有離線版，跟以前一樣）。正式版不開 dev 登入。
      - name: Build online client (only when ONLINE_API_URL is set)
        if: ${{ vars.ONLINE_API_URL != '' }}
        run: |
          npm run build:online
          node scripts/check-online-bundle.mjs
          cp -r dist-online dist/online
        env:
          VITE_SERVER_URL: ${{ vars.ONLINE_API_URL }}
          VITE_AUTH_MODE: 'off'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
