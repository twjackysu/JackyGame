<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a1b5a"/>
      <stop offset="0.55" stop-color="#121433"/>
      <stop offset="1" stop-color="#070914"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ff8a3a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffe2a8"/>
      <stop offset="1" stop-color="#ff9a4a"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#ffb35a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="200" fill="url(#halo)"/>
  <g fill="none" stroke="#ffd27a" stroke-opacity="0.55">
    <circle cx="256" cy="236" r="150" stroke-width="4"/>
    <circle cx="256" cy="236" r="166" stroke-width="1.5"/>
  </g>
  <!-- eight-pointed star -->
  <g transform="translate(256 236)">
    <path d="M0-140 L22-22 L140 0 L22 22 L0 140 L-22 22 L-140 0 L-22-22 Z" fill="url(#star)"/>
    <path d="M0-90 L14-14 L90 0 L14 14 L0 90 L-14 14 L-90 0 L-14-14 Z" fill="#fffaf0" transform="rotate(45)" opacity="0.85"/>
  </g>
  <!-- sword through the star -->
  <g transform="translate(256 0)">
    <path d="M0 70 L16 110 L12 330 L-12 330 L-16 110 Z" fill="url(#blade)" stroke="#5a2a10" stroke-width="3"/>
    <path d="M0 96 L0 320" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="-62" y="330" width="124" height="18" rx="9" fill="#ffd27a" stroke="#5a2a10" stroke-width="3"/>
    <rect x="-11" y="348" width="22" height="62" rx="5" fill="#7a3a18" stroke="#3a1a08" stroke-width="3"/>
    <circle cx="0" cy="424" r="16" fill="#ffd27a" stroke="#5a2a10" stroke-width="3"/>
  </g>
  <!-- embers -->
  <g fill="#ffb35a">
    <circle cx="120" cy="400" r="5" opacity="0.8"/>
    <circle cx="400" cy="380" r="4" opacity="0.7"/>
    <circle cx="370" cy="440" r="3" opacity="0.6"/>
    <circle cx="150" cy="450" r="3" opacity="0.6"/>
    <circle cx="96" cy="140" r="2.5" fill="#cfe8ff" opacity="0.8"/>
    <circle cx="420" cy="110" r="2.5" fill="#cfe8ff" opacity="0.8"/>
  </g>
</svg>
